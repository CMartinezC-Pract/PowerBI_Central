<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>Visor de Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet"/>

    <style>
        body {
            font-family: 'Lato';
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .viewer-header {
            background: linear-gradient(135deg, #0c1b29 0%, #1a3a5f 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .folio-badge {
            background: #28a745;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .btn-action {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-back {
            background: #6c757d;
            color: white;
        }
        .btn-report {
            background: #dc3545;
            color: white;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
        }
    </style>
</head>
<body>

<div class="viewer-header">
    <div class="dashboard-info">
        <a href="javascript:history.back()" class="btn-action btn-back">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <span class="folio-badge" id="folio">DB-XXX</span>
        <h5 class="mb-0" id="nombre">Cargando...</h5>
    </div>
    <a href="#" id="btnReportar" class="btn-action btn-report">
        <i class="bi bi-exclamation-triangle"></i> Reportar Problema
    </a>
</div>

<iframe id="dashboardFrame" src="about:blank"></iframe>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRVvvkis22L6snCJAekuRJlZJD56lGJyil2cET-XVycwcqCT6GMS5cO5BvbNq2gW3wUg/exec';

document.addEventListener('DOMContentLoaded', async function() {
    const urlParams = new URLSearchParams(window.location.search);
    const folio = urlParams.get('folio');

    if (!folio) {
        alert('No se especificó el folio del dashboard');
        window.history.back();
        return;
    }

    await cargarDashboard(folio);
});

async function cargarDashboard(folio) {
    try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDashboardByFolio&folio=${folio}`);
        const data = await response.json();

        if (data.dashboard) {
            document.getElementById('folio').textContent = data.dashboard.folio;
            document.getElementById('nombre').textContent = data.dashboard.nombre;
            document.getElementById('dashboardFrame').src = data.dashboard.url;
            document.getElementById('btnReportar').href = `reporte-error.html?folio=${data.dashboard.folio}`;
        } else {
            alert('Dashboard no encontrado');
            window.history.back();
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error al cargar el dashboard');
        window.history.back();
    }
}
</script>

</body>
</html>
