<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboards</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet">

    <style>
        body {
            background: transparent;
            color: #101010;
            font-family: 'Lato';
        }

        .content-wrapper {
            background: #f6fce9;
            border-radius: 12px;
        }

        .section-title {
            color: #1a2a09;
            font-weight: 700;
        }

        .section-subtitle {
            color: #3f5a1a;
        }

        .search-input {
            background: #fff;
            border-radius: 8px;
            padding: 10px 14px;
            border: none;
            width: 100%;
        }

        .dashboard-card {
            background: #d9f7d9;
            border-radius: 12px;
            padding: 16px;
            transition: transform .2s;
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
        }

        .folio-badge {
            background: #bbe373;
            color: #1a2a09;
            font-weight: 600;
        }

        .btn-ver {
            background: #77dd77;
            color: #101010;
            font-weight: 600;
            border: none;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }
    </style>
</head>

<body>

    <main class="container py-4">

        <!-- ===== LISTADO ===== -->
        <div id="listView" class="view active">
            <div class="content-wrapper p-4">

                <h2 class="section-title mb-1">
                    <i class="bi bi-grid-3x3-gap"></i> Mis Dashboards
                </h2>

                <p class="section-subtitle mb-4">
                    Gestiona y visualiza tus reportes de Power BI en un solo lugar
                </p>

                <!-- BUSCADOR -->
                <input type="text" id="buscador" class="search-input mb-4"
                    placeholder="Buscar por folio o nombre del dashboard..." oninput="filtrarDashboards()">
            </div>

            <!-- GRID -->
            <div class="row g-4" id="dashboardGrid">


                <!-- CARD -->
                <div class="col-md-6 col-lg-4 dashboard-item"> <br>
                    <div class="dashboard-card h-100">
                        <span class="badge folio-badge mb-2">DB-001 </span>
                        <h5 class="mt-2 dashboard-title">Ventas Regionales</h5>
                        <p class="text-muted small">
                            Dashboard de desempeño comercial por región 
                        </p>

                        <button class="btn btn-ver btn-sm w-100" onclick="openViewer(
                                'DB-001',
                                'Ventas Regionales',
                                'https://app.powerbi.com/reportEmbed?reportId=950ee71c-95ac-4931-b153-dd0505ae6049&autoAuth=true&ctid=5539201f-944b-4a7f-a1b7-d6e298fbe803'
                            )">
                            <i class="bi bi-eye"></i> Ver
                        </button>
                    </div>
                </div>
                <!-- FIN CARD -->

            </div>

        </div>

        <!-- ===== VISOR ===== -->
        <div id="viewerView" class="view">
            <div class="content-wrapper p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <button class="btn btn-secondary btn-sm mb-2" onclick="showList()">
                            <i class="bi bi-arrow-left"></i> Volver
                        </button>
                        <br>
                        <span class="badge folio-badge" id="viewerFolio"></span>
                        <h4 class="mt-2" id="viewerTitle"></h4>
                    </div>
                    <a id="btnReportar" href="reporte-error.html" class="btn btn-danger btn-sm">
                        <i class="bi bi-exclamation-triangle"></i> Reportar problema
                    </a>
                </div>
            </div>
            <iframe id="dashboardFrame" class="w-100" style="height:100vh;border:none;"></iframe>


        </div>

    </main>

    <script src="js/dashboards.js"></script>
</body>

</html>
