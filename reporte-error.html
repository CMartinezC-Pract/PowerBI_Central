<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportar Problema</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet">

    <style>
        body {
            background: transparent;
            color: #101010;
            font-family: 'Lato';
        }

        .content-wrapper {
            background: #f6fce9;
            border-radius: 12px;
        }

        .section-title {
            color: #1a2a09;
            font-weight: 700;
        }

        .section-subtitle {
            color: #3f5a1a;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }

        .folio-badge {
            background: #bbe373;
            color: #1a2a09;
            font-weight: 600;
        }

        .btn-enviar {
            background: #77dd77;
            color: #101010;
            font-weight: 600;
            border: none;
        }
    </style>
</head>

<body>
    <main class="container py-4">
        <div class="content-wrapper p-4">

            <h2 class="section-title mb-1">
                <i class="bi bi-exclamation-triangle"></i> Reportar Problema
            </h2>

            <p class="section-subtitle mb-4">
                Ayúdanos a mejorar reportando cualquier inconveniente con el dashboard
            </p>

            <!-- FOLIO -->
            <div class="mb-3">
                <label class="form-label">Folio del Dashboard</label><br>
                <span class="badge folio-badge" id="folioLabel">---</span>
                <input type="hidden" id="folioInput">
            </div>

            <!-- FORMULARIO -->
            <form onsubmit="enviarReporte(event)">

                <div class="mb-3">
                    <label class="form-label">Tipo de problema</label>
                    <select class="form-select" id="tipo" required>
                        <option value="">Selecciona una opción</option>
                        <option>Datos incorrectos</option>
                        <option>Dashboard no carga</option>
                        <option>Error de visualización</option>
                        <option>Información desactualizada</option>
                        <option>Otro</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción del problema</label>
                    <textarea class="form-control" id="descripcion" rows="4"
                        placeholder="Describe el problema con el mayor detalle posible..."
                        required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tu correo (opcional)</label>
                    <input type="email" class="form-control" id="correo"
                        placeholder="nombre@empresa.com">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-enviar w-100">
                        <i class="bi bi-send"></i> Enviar Reporte
                    </button>
                    <button type="button" class="btn btn-secondary w-100" onclick="volver()">
                        Cancelar
                    </button>
                </div>

            </form>

        </div>
    </main>

    <!-- JS -->
    <script>
        // Obtener folio desde la URL
        const params = new URLSearchParams(window.location.search);
        const folio = params.get("folio");

        if (folio) {
            document.getElementById("folioLabel").innerText = folio;
            document.getElementById("folioInput").value = folio;
        }

        function enviarReporte(e) {
            e.preventDefault();

            const data = {
                folio: document.getElementById("folioInput").value,
                tipo: document.getElementById("tipo").value,
                descripcion: document.getElementById("descripcion").value,
                correo: document.getElementById("correo").value
            };

            console.log("Reporte enviado:", data);

            alert("✅ Reporte enviado correctamente. Gracias por tu apoyo.");

            window.location.href = "dashboards.html";
        }

        function volver() {
            window.history.back();
        }
    </script>

</body>

</html>
