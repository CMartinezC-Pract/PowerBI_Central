<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reportar Problema - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Lato';
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .report-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .report-header {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .report-body {
            padding: 30px;
        }
        .dashboard-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
        }
        .required:after {
            content: " *";
            color: #dc3545;
        }
        .btn-submit {
            background: #dc3545;
            color: white;
            padding: 12px 30px;
            font-weight: 600;
            border: none;
        }
        .btn-submit:hover {
            background: #c82333;
        }
        .btn-back {
            background: #6c757d;
            color: white;
        }
        .btn-back:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>

<div class="report-container">
    <div class="report-header">
        <h2><i class="bi bi-exclamation-triangle-fill"></i> Reportar Problema</h2>
        <p class="mb-0">Ayúdanos a mejorar reportando cualquier inconveniente</p>
    </div>

    <div class="report-body">
        <!-- INFO DEL DASHBOARD -->
        <div class="dashboard-info">
            <h5 class="mb-3"><i class="bi bi-info-circle"></i> Dashboard a reportar</h5>
            <p class="mb-1"><strong>Folio:</strong> <span id="dashboardFolio">Cargando...</span></p>
            <p class="mb-1"><strong>Nombre:</strong> <span id="dashboardNombre">Cargando...</span></p>
            <p class="mb-0"><strong>Responsable:</strong> <span id="dashboardResponsable">Cargando...</span></p>
        </div>

        <!-- FORMULARIO -->
        <form id="reportForm">
            <!-- Tipo de Problema -->
            <div class="mb-4">
                <label for="tipoProblema" class="form-label required">Tipo de Problema</label>
                <select class="form-select" id="tipoProblema" required>
                    <option value="">Seleccione un tipo de problema</option>
                    <option value="Datos incorrectos">Datos incorrectos</option>
                    <option value="Dashboard no carga">Dashboard no carga</option>
                    <option value="Error de visualización">Error de visualización</option>
                    <option value="Información desactualizada">Información desactualizada</option>
                    <option value="No tengo permisos de acceso">No tengo permisos de acceso</option>
                    <option value="Otro problema">Otro problema</option>
                </select>
            </div>

            <!-- Nombre -->
            <div class="mb-4">
                <label for="nombreReportante" class="form-label required">Tu Nombre</label>
                <input type="text" class="form-control" id="nombreReportante" placeholder="Nombre completo" required>
            </div>

            <!-- Correo -->
            <div class="mb-4">
                <label for="correoReportante" class="form-label required">Tu Correo</label>
                <input type="email" class="form-control" id="correoReportante" placeholder="correo@xcaret.com" required>
            </div>

            <!-- Descripción -->
            <div class="mb-4">
                <label for="descripcion" class="form-label">Descripción del Problema (Opcional)</label>
                <textarea class="form-control" id="descripcion" rows="4" 
                    placeholder="Proporciona detalles adicionales que puedan ayudar a resolver el problema..."></textarea>
                <div class="form-text">Máximo 500 caracteres</div>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-back" onclick="volver()">
                    <i class="bi bi-arrow-left"></i> Volver
                </button>
                <button type="submit" class="btn btn-submit flex-grow-1">
                    <i class="bi bi-send"></i> Enviar Reporte
                </button>
            </div>
        </form>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="text-center mt-4 d-none">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2">Enviando reporte...</p>
        </div>
    </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRVvvkis22L6snCJAekuRJlZJD56lGJyil2cET-XVycwcqCT6GMS5cO5BvbNq2gW3wUg/exec';

let dashboardData = {};

// Cargar datos del dashboard al iniciar
document.addEventListener('DOMContentLoaded', async function() {
    const urlParams = new URLSearchParams(window.location.search);
    const folio = urlParams.get('folio');

    if (!folio) {
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'No se especificó el folio del dashboard',
        }).then(() => {
            window.history.back();
        });
        return;
    }

    await cargarDatosDashboard(folio);
});

// Cargar datos del dashboard desde Google Sheets
async function cargarDatosDashboard(folio) {
    try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDashboardByFolio&folio=${folio}`);
        const data = await response.json();

        if (data.dashboard) {
            dashboardData = data.dashboard;
            document.getElementById('dashboardFolio').textContent = dashboardData.folio;
            document.getElementById('dashboardNombre').textContent = dashboardData.nombre;
            document.getElementById('dashboardResponsable').textContent = 
                `${dashboardData.responsable} (${dashboardData.correo})`;
        } else {
            throw new Error('Dashboard no encontrado');
        }
    } catch (error) {
        console.error('Error:', error);
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'No se pudieron cargar los datos del dashboard',
        }).then(() => {
            window.history.back();
        });
    }
}

// Enviar reporte
document.getElementById('reportForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const loadingIndicator = document.getElementById('loadingIndicator');
    loadingIndicator.classList.remove('d-none');

    const reporteData = {
        action: 'saveReporte',
        folioDashboard: dashboardData.folio,
        nombreDashboard: dashboardData.nombre,
        tipoProblema: document.getElementById('tipoProblema').value,
        nombreReportante: document.getElementById('nombreReportante').value,
        correoReportante: document.getElementById('correoReportante').value,
        descripcion: document.getElementById('descripcion').value,
        responsableDashboard: dashboardData.responsable,
        correoResponsable: dashboardData.correo
    };

    try {
        const formData = new URLSearchParams();
        for (const key in reporteData) {
            formData.append(key, reporteData[key]);
        }

        const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: formData
        });

        const result = await response.json();

        loadingIndicator.classList.add('d-none');

        if (result.success) {
            Swal.fire({
                icon: 'success',
                title: '¡Reporte enviado!',
                html: `
                    <p><strong>Folio de reporte:</strong> ${result.folioReporte}</p>
                    <p>Se ha notificado al responsable del dashboard.</p>
                    <p class="text-muted small">Recibirás una respuesta a tu correo</p>
                `,
                confirmButtonText: 'Aceptar'
            }).then(() => {
                window.history.back();
            });
        } else {
            throw new Error(result.error || 'Error desconocido');
        }

    } catch (error) {
        loadingIndicator.classList.add('d-none');
        Swal.fire({
            icon: 'error',
            title: 'Error al enviar',
            text: error.message
        });
    }
});

function volver() {
    window.history.back();
}
</script>

</body>
</html>
