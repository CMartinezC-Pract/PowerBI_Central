<!doctype html>
<html lang="es" class="h-100">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/ing/Icon.svg">
    <title>PowerBI Central - Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/site.css" />
    <style>
        /* Quitamos el scroll del layout para que no haya doble barra */
        body {
            overflow: hidden;
        }

        /* El iframe ocupa todo el espacio entre el header y el footer */
        .contenedor-dinamico {
            width: 100%;
            height: calc(100vh - 110px);
            /* Ajuste para header y footer */
            border: none;
            background: transparent;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar header-fijo navbar-expand-sm navbar-light border-top bg-white  border-bottom shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-dark" href="index.html">
                    <img src="/ing/logo.svg" alt="Logo PowerBI Central" height="40">
                    <i class="bi text-info"></i> PowerBI Central
                </a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="inicio.html" target="pantalla">
                                <i class="bi bi-house-door"></i> Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="unidades.html" target="pantalla">
                                <i class="bi bi-grid-3x3-gap"></i> Mis Dashboards
                            </a>
                        </li> 
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <iframe src="inicio.html" name="pantalla" class="contenedor-dinamico"></iframe>

    <footer class="footer border-top">
        <div class="container text-center py-2 text-white">
            &copy; 2026 - Área de Innovación y Optimización · Grupo Xcaret · Power BI Central
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
