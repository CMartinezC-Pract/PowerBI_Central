<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Unidades de Negocio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet">

    <style>
        body {
            font-family: 'Lato';
            background: #ffffff;
        }

        .unit-card {
            border-radius: 16px;
            overflow: hidden;
            transition: transform .25s, box-shadow .25s;
            cursor: pointer;
        }

        .unit-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, .15);
        }

        .unit-card img {
            height: 180px;
            object-fit: cover;
        }

        .unit-title {
            font-weight: 700;
            color: #1a2a09;
        }

        .btn-enter {
            background: #77dd77;
            font-weight: 600;
            border: none;
        }

        .unit-title:hover {
            color: #0066cc;
            /* Cambia el color al pasar el mouse */
            transition: color 0.2s ease;
        }
    </style>
</head>

<body>
    <main class="container py-5 ">
        <section class="hero">
            <div class="" style="background-color: #16314f; color: white; padding: 20px;">
                <div class="text-center mb-5">
                    <h2 class="fw-bold">
                        <i class="bi bi-buildings"></i> Unidades de Negocio
                    </h2>
                    <br>
                    <p class="lead">
                        Aquí encontraras los tableros con información del negocio,<br> conocimiento de los turistas en
                        el
                        destino, estudios de mercado, casos de uso y más.
                    </p>
                </div>
            </div>
        </section>
        <br>
        <div class=" container row g-5">

            <!-- ENTORNO TURÍSTICO -->
            <div class="col-md-6">
                <div class="card unit-card">
                    <div class="position-relative">
                        <img src="img/image_3.jpg" class="card-img-top" alt="Entorno Turístico">
                        <div
                            class="position-absolute top-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <a href="unidades/entorno-turistico.html" class="btn btn-dark text-decoration-none">
                                Entorno Turístico
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PARQUES Y TOURS -->
            <div class="col-md-6">
                <div class="card unit-card">
                    <div class="position-relative">
                        <img src="img/image_5.jpg" class="card-img-top" alt="Parques y Tours">
                        <div
                            class="position-absolute top-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <a href="unidades/parques-tours.html" class="btn btn-dark text-decoration-none">
                                Parques y Tours
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- HOTELES -->
            <div class="col-md-6">
                <div class="card unit-card">
                    <div class="position-relative">
                        <img src="img/image_4.jpg" class="card-img-top" alt="Hoteles">
                        <div
                            class="position-absolute top-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <a href="unidades/hoteles.html" class="btn btn-dark text-decoration-none">
                                Hoteles
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- XAILING -->
            <div class="col-md-6">
                <div class="card unit-card">
                    <div class="position-relative">
                        <img src="img/image_6.jpg" class="card-img-top" alt="Xailing">
                        <div
                            class="position-absolute top-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <a href="unidades/xailing.html" class="btn btn-dark text-decoration-none">
                                Xailing
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MDC -->
            <div class="col-md-6">
                <div class="card unit-card">
                    <div class="position-relative">
                        <img src="img/image_7.jpg" class="card-img-top" alt="México Destination Club">
                        <div
                            class="position-absolute top-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <a href="unidades/mdc.html" class="btn btn-dark text-decoration-none">
                                México Destination Club (MDC)
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SATISFACCIÓN DE NEGOCIO -->
            <div class="col-md-6">
                <div class="card unit-card">
                    <div class="position-relative">
                        <img src="img/image_8.jpg" class="card-img-top" alt="Satisfacción de Negocio">
                        <div
                            class="position-absolute top-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <a href="unidades/satisfaccion-negocio.html" class="btn btn-dark text-decoration-none">
                                Satisfacción de Negocio
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TALENTO HUMANO -->
            <div class="col-md-6">
                <div class="card unit-card">
                    <div class="position-relative">
                        <img src="img/image_9.jpg" class="card-img-top" alt="Talento Humano">
                        <div
                            class="position-absolute top-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <a href="unidades/talento-humano.html" class="btn btn-dark text-decoration-none">
                                Talento Humano
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- GRUPO XCARET -->
            <div class="col-md-6">
                <div class="card unit-card">
                    <div class="position-relative">
                        <img src="img/image_10.jpg" class="card-img-top" alt="Grupo Xcaret">
                        <div
                            class="position-absolute top-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center p-3">
                            <a href="unidades/grupo-xcaret.html" class="btn btn-dark text-decoration-none">
                                Grupo Xcaret
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</body>

</html>
