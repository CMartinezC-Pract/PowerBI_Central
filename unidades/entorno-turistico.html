<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboards - Entorno Turístico</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet"/>

    <style>
        body {
            background: transparent;
            color: #101010;
            font-family: 'Lato';
        }
        .content-wrapper {
            background: #f6fce9;
            border-radius: 12px;
        }
        .section-title {
            color: #1a2a09;
            font-weight: 700;
        }
        .section-subtitle {
            color: #3f5a1a;
        }
        .search-input {
            background: #fff;
            border-radius: 8px;
            padding: 10px 14px;
            border: none;
            width: 100%;
        }
        .dashboard-card {
            background: #d9f7d9;
            border-radius: 12px;
            padding: 16px;
            transition: transform .2s;
        }
        .dashboard-card:hover {
            transform: translateY(-4px);
        }
        .folio-badge {
            background: #bbe373;
            color: #1a2a09;
            font-weight: 600;
        }
        .btn-ver {
            background: #77dd77;
            color: #101010;
            font-weight: 600;
            border: none;
        }
        .spinner-container {
            text-align: center;
            padding: 40px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
    </style>
</head>

<body>

<main class="container py-4">

    <!-- CABECERA -->
    <div class="content-wrapper p-4 mb-4">
        <h2 class="section-title mb-1">
            <i class="bi bi-grid-3x3-gap"></i> Entorno Turístico
        </h2>
        <p class="section-subtitle">
            Gestiona y visualiza tus reportes de Power BI en un solo lugar
        </p>

        <input type="text" id="buscador" class="search-input"
               placeholder="Buscar por folio o nombre..."
               oninput="filtrarDashboards()">
    </div>

    <!-- LOADING -->
    <div id="loadingSpinner" class="spinner-container">
        <div class="spinner-border text-success"></div>
        <p class="mt-3">Cargando dashboards...</p>
    </div>

    <!-- EMPTY -->
    <div id="emptyState" class="empty-state d-none">
        <i class="bi bi-inbox" style="font-size:4rem;color:#dee2e6;"></i>
        <h4 class="mt-3">No hay dashboards disponibles</h4>
    </div>

    <!-- GRID -->
    <div id="dashboardGrid" class="row g-4 d-none"></div>

</main>

<script>
/* ================= CONFIG ================= */
const GOOGLE_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbxd1e7vyFLGrzwkv-amYAUm1Srmgd9-JdIPMXPpuWTeO9Nuf6B50-MU-sUNzvIAT4t9bw/exec';

const CATEGORIA = 'entorno-turistico';

/* ================= INIT ================= */
document.addEventListener('DOMContentLoaded', cargarDashboards);

/* ================= FUNCIONES ================= */

async function cargarDashboards() {
    const loading = document.getElementById('loadingSpinner');
    const empty = document.getElementById('emptyState');
    const grid = document.getElementById('dashboardGrid');

    try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDashboards&categoria=${CATEGORIA}`);
        const data = await res.json();

        loading.classList.add('d-none');

        if (!data.dashboards || data.dashboards.length === 0) {
            empty.classList.remove('d-none');
            return;
        }

        grid.classList.remove('d-none');
        renderizarDashboards(data.dashboards);

    } catch (err) {
        console.error(err);
        loading.classList.add('d-none');
        empty.classList.remove('d-none');
    }
}
 


function renderizarDashboards(dashboards) {
    const grid = document.getElementById('dashboardGrid');
    grid.innerHTML = '';

    dashboards.forEach(d => {
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4 dashboard-item';

        col.innerHTML = `
            <div class="dashboard-card h-100">
                <span class="badge folio-badge">${d.folio}</span>
                <h5 class="mt-2 dashboard-title">${d.nombre}</h5>
                <p class="text-muted small">${d.descripcion || ''}</p>

                <div class="d-grid gap-2">
                    <a href="../visor-dashboard.html?folio=${d.folio}" 
                       class="btn btn-ver btn-sm">
                        <i class="bi bi-eye"></i> Ver Dashboard
                    </a>
                </div>
            </div>
        `;
        grid.appendChild(col);
    });
}




function filtrarDashboards() {
    const texto = document.getElementById('buscador').value.toLowerCase();
    const items = document.querySelectorAll('.dashboard-item');

    items.forEach(item => {
        const folio = item.querySelector('.folio-badge').innerText.toLowerCase();
        const nombre = item.querySelector('.dashboard-title').innerText.toLowerCase();
        item.style.display = (folio.includes(texto) || nombre.includes(texto)) ? '' : 'none';
    });
}
</script>


</body>
</html>
